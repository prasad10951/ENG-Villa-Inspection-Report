<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Villa%20Report%22%2C%22short_name%22%3A%22Villa%20Report%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%2310171d%22%2C%22theme_color%22%3A%22%230b6e6e%22%7D">
<title>Villa Inspection Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#5d6b78;--ac:#0b6e6e;--ln:#d5dce2;--ok:#1e8e3e;--bad:#c5221f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#1b252e;--tx:#e8eef3;--mu:#98a6b3;--ac:#3fb8b0;--ln:#33424f}}
:root[data-theme="dark"]{--bg:#10171d;--card:#1b252e;--tx:#e8eef3;--mu:#98a6b3;--ac:#3fb8b0;--ln:#33424f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Arial,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--ln);z-index:5}
h1{font-size:18px;margin:0 0 8px}
.r{display:flex;gap:8px;align-items:center}
input[type=text],input[type=date],input[type=number]{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);font-size:16px}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.wrap{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.lb{flex:0 0 92px;font-size:14px;color:var(--mu)}
.th{width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid var(--ln);flex:none}
.cam{flex:none;width:48px;height:48px;padding:0;font-size:22px}
.cam{position:relative;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#fff;border-radius:10px;overflow:hidden}.cam input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0}.cam.done{background:var(--ok)}
.seg{display:flex;gap:6px;flex:1}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.seg button{font-size:13px;padding:10px 4px}.seg button.on.md{background:#e8710a;color:#fff}.seg button.on.gd{background:var(--ok);color:#fff}.seg button.on.bd{background:var(--bad);color:#fff}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 12px;border-top:1px solid var(--ln);display:flex;gap:8px}
.bar button{flex:1}.cnt{color:var(--mu);font-size:14px}
#msg{padding:6px 12px;font-size:14px;color:var(--mu);text-align:center}
.top h1{margin:0}.red{background:#c5221f;padding:7px 12px;font-size:14px}.sg{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:14px;color:var(--mu)}.sg input{width:18px;height:18px}textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);font:16px/1.4 system-ui,Arial,sans-serif;resize:vertical}.wc{text-align:right;margin-top:2px}input.miss{border:2px solid var(--bad)}.lb.miss{color:var(--bad);font-weight:700}.cam.miss{background:var(--bad);outline:3px solid var(--bad);outline-offset:1px}.card.bad{border:2px solid var(--bad)}button:disabled{opacity:.4}.bar button{padding:11px 6px;font-size:15px}</style></head><body>
<div class="top"><div class="r" style="justify-content:space-between;margin-bottom:8px"><h1>Arrival Villa Inspection</h1><button class="red" id="nn">Clear all</button></div>
<div class="r"><input type="date" id="dt"><input type="text" id="by" placeholder="Inspected by"></div>
<label class="sg"><input type="checkbox" id="sg" checked> Save photos to gallery</label></div>
<div class="wrap"><div id="list"></div></div>
<div id="msg"></div>
<div class="bar"><button class="g" id="add">+ Add villa</button><button id="sub">Submit</button><button id="pdf">Make PDF</button></div>
<input type="file" id="fi" accept="image/*" capture="environment" style="position:fixed;left:-300px;top:0;opacity:0">
<input type="file" id="fg" accept="image/*" style="position:fixed;left:-300px;top:0;opacity:0">
<div id="cv" style="display:none;position:fixed;inset:0;background:#000;z-index:20;flex-direction:column"><video id="vd" autoplay playsinline muted style="flex:1;min-height:0;width:100%;object-fit:cover"></video><div style="display:flex;gap:8px;padding:14px;justify-content:center"><button class="g" id="cx">Cancel</button><button class="g" id="gl">🖼 Gallery</button><button id="sh" style="padding:14px 22px">📷 Take photo</button></div></div>
<script>
const ITEMS=[["hot","Hot water °C"],["ac","FCU grill °C"],["pool","Pool water °C"],["mini","Minibar °C"],["tv","TV & sounds"],["wc","WC"],["slide","Balcony sliding door"],["cond","Pool condition"],["land","Landscaping"]];
const OPTS={cond:[["Good","gd"],["Slightly cloudy","md"],["Cloudy","bd"]],land:[["Well maintained","gd"],["Requires trimming","bd"]],tv:[["Working","gd"],["Not working","bd"]],slide:[["Working","gd"],["Not working","bd"]],wc:[["Good","gd"],["Needs attention","bd"]]};
let S={date:new Date().toISOString().slice(0,10),by:"",gal:true,villas:[]},cur=null,db=null,tmr=null,nnArm=false,stream=null,showMiss=false;
const COMP=["hot","ac","pool","mini"];
function missing(v){const m=[];if(!String(v.no||"").trim())m.push("Villa No");COMP.forEach(k=>{const it=v.items[k]||{},ln=ITEMS.find(x=>x[0]===k)[1].replace(" °C","");if(it.v===""||it.v==null)m.push(ln+" reading");if(!it.p)m.push(ln+" photo")});return m}
function updateBar(){const b=$("sub");if(!b)return;b.textContent=S.sub?"Submitted ✓":"Submit";b.style.background=S.sub?"var(--ok)":"";$("pdf").disabled=!S.sub}
const $=id=>document.getElementById(id),say=t=>{$("msg").textContent=t};
/*PLAT*/
async function PSAVE(name,data){const u=URL.createObjectURL(new Blob([data]));const l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function DELIVER(buf,name){const f=new File([buf],name,{type:"application/pdf"});
if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});say("Done.")}
else{await PSAVE(name,buf);say("PDF saved in Downloads. Open it and share to WhatsApp.")}}
/*END*/
function openDB(){return new Promise(res=>{try{const q=indexedDB.open("villa",1);q.onupgradeneeded=()=>q.result.createObjectStore("s");q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>res()}catch(e){res()}})}
function load(){return new Promise(res=>{if(!db)return res();try{const g=db.transaction("s").objectStore("s").get("d");g.onsuccess=()=>{if(g.result)S=g.result;res()};g.onerror=()=>res()}catch(e){res()}})}
function save(){S.sub=false;updateBar();clearTimeout(tmr);tmr=setTimeout(()=>{if(!db)return;try{db.transaction("s","readwrite").objectStore("s").put(S,"d")}catch(e){}},400)}
function newVilla(){const o={no:"",note:"",cp:[],items:{}};ITEMS.forEach(([k])=>o.items[k]={v:"",p:"",t:""});return o}
function render(){const L=$("list");L.innerHTML="";
S.villas.forEach((v,i)=>{ITEMS.forEach(([k])=>{v.items[k]=v.items[k]||{v:"",p:"",t:""}});v.cp=v.cp||[];
const c=document.createElement("div");const mi=showMiss?missing(v):[];c.className="card"+(mi.length?" bad":"");
c.innerHTML=`<div class="r"><input type="text" inputmode="numeric" placeholder="Villa No" value="${v.no}" data-i="${i}" class="vn${mi.includes("Villa No")?" miss":""}"><button class="g" data-del="${i}">✕</button></div>`;
if(mi.length){const w=document.createElement("div");w.className="cnt";w.style.cssText="color:var(--bad);font-weight:600;margin-top:6px";w.textContent="Missing: "+mi.join(", ");c.appendChild(w)}
ITEMS.forEach(([k,l])=>{const it=v.items[k],r=document.createElement("div");r.className="row";const ln=l.replace(" °C",""),mv=mi.includes(ln+" reading"),mp=mi.includes(ln+" photo");
const mid=OPTS[k]?`<div class="seg">${OPTS[k].map(([n,cl])=>`<button class="${cl} ${it.v===n?"on":""}" data-c="${i}|${k}" data-val="${n}">${n}</button>`).join("")}</div>`:`<input type="number" inputmode="decimal" step="0.1" placeholder="°C" value="${it.v}" data-i="${i}" data-k="${k}" class="rd${mv?" miss":""}" style="flex:1">`;
r.innerHTML=`<div class="lb${mv||mp?" miss":""}">${l}</div>${mid}${it.p?`<img class="th" src="${it.p}">`:""}<button class="cam ${it.p?"done":""}${mp?" miss":""}" data-p="${i}|${k}">📷</button>`;c.appendChild(r)});
const nt=document.createElement("div");nt.className="row";nt.style.flexDirection="column";nt.style.alignItems="stretch";nt.innerHTML=`<textarea rows="3" placeholder="Comments - one point on each line (max 100 words)" data-i="${i}" class="nt"></textarea><div class="cnt wc"></div>`;nt.querySelector("textarea").value=v.note||"";nt.querySelector(".wc").textContent=wc(v.note||"")+" / 100 words";c.appendChild(nt);
const cr=document.createElement("div");cr.className="row";cr.style.flexWrap="wrap";cr.innerHTML=`<button class="cam" data-p="${i}|c">📷</button><span class="cnt">Comment photos: ${v.cp.length}</span>`+v.cp.map((q,m)=>`<button class="g" style="padding:0;border:0;background:none" data-rm="${i}|${m}"><img class="th" src="${q.p}"></button>`).join("");c.appendChild(cr);
L.appendChild(c)});
$("pdf").textContent=`Make PDF (${S.villas.length})`;updateBar()}
document.addEventListener("input",e=>{const t=e.target;if(t.classList.contains("miss")&&t.value)t.classList.remove("miss");
if(t.id==="dt")S.date=t.value;else if(t.id==="by")S.by=t.value;else if(t.id==="sg")S.gal=t.checked;
else if(t.classList.contains("vn"))S.villas[t.dataset.i].no=t.value;
else if(t.classList.contains("nt")){let x=t.value;if(wc(x)>100){let c=0,re=/\S+/g,e;while((e=re.exec(x))){if(++c===100){x=x.slice(0,e.index+e[0].length);break}}t.value=x}S.villas[t.dataset.i].note=x;t.parentNode.querySelector(".wc").textContent=wc(x)+" / 100 words"}
else if(t.classList.contains("rd"))S.villas[t.dataset.i].items[t.dataset.k].v=t.value;save()});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.del!==undefined){if(b.dataset.arm){S.villas.splice(+b.dataset.del,1);save();render()}else{b.dataset.arm=1;b.textContent="Delete?"}}
else if(b.dataset.p){openCam(b.dataset.p)}
else if(b.dataset.rm){if(b.dataset.arm){const [a,m]=b.dataset.rm.split("|");S.villas[a].cp.splice(m,1);save();render()}else{b.dataset.arm=1;b.style.outline="3px solid #c5221f";say("Tap the photo again to remove it.")}}
else if(b.dataset.c!==undefined){const [a,k]=b.dataset.c.split("|");S.villas[a].items[k].v=b.dataset.val;save();render()}});
$("sub").onclick=()=>{if(!S.villas.length)return say("Add a villa first.");const bad=S.villas.filter(v=>missing(v).length);if(bad.length){showMiss=true;S.sub=false;render();const f1=document.querySelector(".card.bad");if(f1)f1.scrollIntoView({block:"center"});say("Cannot submit. "+bad.length+" villa(s) have missing details (in red).");return}showMiss=false;S.sub=true;render();clearTimeout(tmr);try{db&&db.transaction("s","readwrite").objectStore("s").put(S,"d")}catch(e){}say("Submitted. Now you can make the PDF.")};
$("add").onclick=()=>{S.villas.push(newVilla());save();render();const n=document.querySelectorAll(".vn");n[n.length-1].focus()};
$("nn").onclick=()=>{if(!nnArm){nnArm=true;$("nn").textContent="Tap again to confirm";setTimeout(()=>{nnArm=false;$("nn").textContent="Clear all"},4000)}else{S.villas=[];nnArm=false;$("nn").textContent="Clear all";save();render()}};
const wc=t=>(t.match(/\S+/g)||[]).length;
function pts(d,note,y){const L=(note||"").split("\n").map(s=>s.trim()).filter(Boolean);if(!L.length)return;d.setFontSize(10);d.setTextColor(0);d.setFont(undefined,"bold");d.text("Comments:",10,y);d.setFont(undefined,"normal");y+=5.5;d.setFontSize(9.5);L.forEach((s,n)=>{d.splitTextToSize((n+1)+". "+s,188).forEach(w=>{if(y>288){d.addPage();y=14}d.text(w,10,y);y+=4.6})})}
const p2=n=>String(n).padStart(2,"0");
function fmt(d){return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("cv").style.display="none"}
async function openCam(p){cur=p;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("vd").srcObject=stream;$("cv").style.display="flex";say("")}catch(err){say("Live camera not allowed. Trying phone camera...");$("fi").value="";$("fi").click()}}
$("cx").onclick=stopCam;
$("gl").onclick=()=>{stopCam();$("fg").value="";$("fg").click()};
$("sh").onclick=()=>{const v=$("vd");if(!v.videoWidth)return;const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);stopCam();c.toBlob(b=>store(b,cur,"cam"),"image/jpeg",.92)};
document.addEventListener("change",e=>{const t=e.target;if((t.id!=="fi"&&t.id!=="fg")||!t.files[0])return;store(t.files[0],cur,t.id==="fg"?"gal":"nat")});
function mk(img,max,t){const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s),c=document.createElement("canvas");c.width=w;c.height=h;
const x=c.getContext("2d");x.drawImage(img,0,0,w,h);const fs=Math.max(14,Math.round(w/28));x.font=`bold ${fs}px Arial`;const tw=x.measureText(t).width+12;x.fillStyle="rgba(0,0,0,.6)";x.fillRect(0,h-fs-10,tw,fs+10);x.fillStyle="#fff";x.fillText(t,6,h-8);return c}
function store(f,p,src){if(!p)return;const [i,k]=p.split("|"),url=URL.createObjectURL(f),img=new Image();
img.onload=()=>{const t=fmt(src==="gal"&&f.lastModified?new Date(f.lastModified):new Date()),c=mk(img,640,t),V=S.villas[i];
const it=k==="c"?{}:V.items[k];it.p=c.toDataURL("image/jpeg",.6);it.t=t;it.w=c.width;it.h=c.height;if(k==="c")V.cp.push(it);
if(S.gal&&src==="cam"){const nm=`Villa${V.no||"x"}_${k}_${Date.now()}.jpg`;mk(img,1600,t).toBlob(async b=>{try{await PSAVE(nm,await b.arrayBuffer())}catch(e){say("Could not save to gallery.")}},"image/jpeg",.9)}
URL.revokeObjectURL(url);save();render()};img.src=url}
function build(){const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),bw=60,bh=55;
S.villas.forEach((v,n)=>{if(n>0)d.addPage();d.setFontSize(10);d.setTextColor(90);d.text(`Arrival Villa Inspection  |  ${S.date}  |  ${S.by}`,10,9);
const y0=14;d.setFontSize(13);d.setTextColor(0);d.setFont(undefined,"bold");d.text(`Villa ${v.no||"-"}`,10,y0+4);d.setFont(undefined,"normal");
ITEMS.forEach(([k,l],j)=>{const it=v.items[k]||{},x=10+(j%3)*65,y=y0+8+Math.floor(j/3)*(bh+14);
if(it.p){const a=Math.min(bw/(it.w||4),bh/(it.h||3));d.addImage(it.p,"JPEG",x,y,(it.w||4)*a,(it.h||3)*a)}else{d.setDrawColor(180);d.rect(x,y,bw,bh);d.setFontSize(9);d.setTextColor(150);d.text("No photo",x+bw/2,y+bh/2,{align:"center"})}
d.setFontSize(9);d.setTextColor(0);d.text(`${l.replace(" °C","")}: ${it.v?it.v+(OPTS[k]?"":" °C"):"-"}`,x,y+bh+4);if(it.t){d.setFontSize(8);d.setTextColor(110);d.text(it.t,x,y+bh+8)}});
pts(d,v.note,y0+8+3*(bh+14)+1);});
S.villas.filter(v=>(v.cp||[]).length).forEach(v=>{const L=v.cp;for(let a=0;a<L.length;a+=6){d.addPage();d.setFontSize(13);d.setTextColor(0);d.setFont(undefined,"bold");d.text(`Villa ${v.no||"-"} - Comment photos`,10,14);d.setFont(undefined,"normal");
L.slice(a,a+6).forEach((q,j)=>{const x=10+(j%2)*100,y=28+Math.floor(j/2)*86,r=Math.min(90/(q.w||4),75/(q.h||3));d.addImage(q.p,"JPEG",x,y,(q.w||4)*r,(q.h||3)*r);d.setFontSize(8);d.setTextColor(110);d.text(q.t||"",x,y+79)})}});
return d}
$("pdf").onclick=async()=>{if(!S.villas.length)return say("Add a villa first.");if(!S.sub)return say("Please submit first.");say("Making PDF...");await new Promise(r=>setTimeout(r,60));
try{const d=build();await DELIVER(d.output("arraybuffer"),`Villa_Report_${S.date}.pdf`)}
catch(err){say(err&&(err.name==="AbortError"||err.code==="declined")?"Cancelled.":"Could not make PDF: "+(err&&err.message||err))}};
(async()=>{await openDB();await load();$("dt").value=S.date;$("by").value=S.by;$("sg").checked=S.gal!==false;if(!S.villas.length)S.villas.push(newVilla());render()})();
</script></body></html>
